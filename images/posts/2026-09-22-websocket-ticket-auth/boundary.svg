<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="600" viewBox="0 0 1200 600" role="img" aria-label="删掉前端密钥，只完成了整改的一部分"><rect width="1200" height="600" rx="24" fill="#f5f0e8"/><g font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif"><rect x="46" y="42" width="8" height="42" rx="4" fill="#e8655a"/><text x="76" y="74" font-size="31" fill="#22344a" font-weight="700">删掉前端密钥，只完成了整改的一部分</text><rect x="48" y="130" width="1104" height="117" rx="18" fill="#ffffff"/><rect x="48" y="130" width="210" height="117" rx="18" fill="#a8d8ea"/><text x="72" y="196" font-size="25" fill="#22344a" font-weight="700">兼容期</text><text x="287" y="175" font-size="25" fill="#22344a" font-weight="700">先升级后端，再升级客户端</text><text x="287" y="214" font-size="22" fill="#52677a" font-weight="400">观测旧凭证回落，检查实际业务消息</text><rect x="48" y="270" width="1104" height="117" rx="18" fill="#ffffff"/><rect x="48" y="270" width="210" height="117" rx="18" fill="#b5e5cf"/><text x="72" y="336" font-size="25" fill="#22344a" font-weight="700">关闭旧认证</text><text x="287" y="315" font-size="25" fill="#22344a" font-weight="700">确认旧客户端已经迁移</text><text x="287" y="354" font-size="22" fill="#52677a" font-weight="400">短期票据仍可能在 TTL 内被重放</text><rect x="48" y="410" width="1104" height="117" rx="18" fill="#ffffff"/><rect x="48" y="410" width="210" height="117" rx="18" fill="#d5c6e0"/><text x="72" y="476" font-size="25" fill="#22344a" font-weight="700">轮换旧密钥</text><text x="287" y="455" font-size="25" fill="#22344a" font-weight="700">撤销已经暴露的签名能力</text><text x="287" y="494" font-size="22" fill="#52677a" font-weight="400">不能继续用泄露密钥给新票据签名</text></g></svg>