<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 330" font-family="Microsoft YaHei, PingFang SC, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#2f7e9e"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="820" height="330" fill="#f7fafb"/>
  <text x="410" y="30" text-anchor="middle" font-size="16" font-weight="bold" fill="#1f4e5f">录像 / 截图线上存储调用链</text>

  <!-- boxes -->
  <g stroke="#2f7e9e" stroke-width="1.5" fill="#ffffff">
    <rect x="30"  y="80" width="150" height="72" rx="8"/>
    <rect x="245" y="80" width="150" height="72" rx="8"/>
    <rect x="460" y="80" width="170" height="72" rx="8"/>
    <rect x="680" y="45" width="120" height="60" rx="8" fill="#eaf5f9"/>
    <rect x="680" y="155" width="120" height="60" rx="8" fill="#eaf5f9"/>
  </g>

  <!-- box labels -->
  <g fill="#1f4e5f" text-anchor="middle">
    <text x="105" y="110" font-size="14" font-weight="bold">浏览器</text>
    <text x="105" y="130" font-size="12" fill="#4a6b77">监控页 截图/录屏</text>

    <text x="320" y="110" font-size="14" font-weight="bold">API 网关</text>
    <text x="320" y="130" font-size="12" fill="#4a6b77">登录鉴权 / 路由</text>

    <text x="545" y="103" font-size="14" font-weight="bold">security 服务</text>
    <text x="545" y="122" font-size="12" fill="#4a6b77">摄像头权限校验</text>
    <text x="545" y="138" font-size="12" fill="#4a6b77">业务校验 / 审计日志</text>

    <text x="740" y="72" font-size="13" font-weight="bold">附件服务</text>
    <text x="740" y="90" font-size="11" fill="#4a6b77">文件本体存取</text>

    <text x="740" y="182" font-size="13" font-weight="bold">MySQL</text>
    <text x="740" y="200" font-size="11" fill="#4a6b77">业务记录 / 软删除</text>
  </g>

  <!-- arrows -->
  <g stroke="#2f7e9e" stroke-width="1.8" fill="none">
    <line x1="180" y1="116" x2="241" y2="116" marker-end="url(#arrow)"/>
    <line x1="395" y1="116" x2="456" y2="116" marker-end="url(#arrow)"/>
    <path d="M 630 100 C 655 95 660 80 676 76" marker-end="url(#arrow)"/>
    <path d="M 630 135 C 655 142 660 165 676 178" marker-end="url(#arrow)"/>
  </g>
  <g font-size="11" fill="#4a6b77" text-anchor="middle">
    <text x="212" y="106">HTTP</text>
    <text x="428" y="106">路由</text>
    <text x="652" y="62" transform="rotate(-8 652 62)">multipart 上传</text>
    <text x="655" y="168" transform="rotate(10 655 168)">记录 CRUD</text>
  </g>

  <!-- bottom notes -->
  <rect x="30" y="245" width="770" height="64" rx="8" fill="#eef3f5"/>
  <g font-size="12" fill="#33525e">
    <text x="48" y="270">· 文件与记录分离：业务表只存 file_id / file_url，文件本体由附件服务统一管理</text>
    <text x="48" y="292">· 删除为软删除，只更新 delete_flag；创建 / 查看 / 改名 / 删除均经 @Log 注解写审计日志</text>
  </g>
</svg>
