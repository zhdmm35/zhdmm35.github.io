<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="600" viewBox="0 0 1200 600" role="img" aria-labelledby="title desc">
  <title id="title">两个业务入口复用统一告警能力</title>
  <desc id="desc">水泵房和机房薄页面接入共享规则和统一告警记录，继续使用既有处置链路和关联配置。</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0,0 L10,3 L0,6 Z" fill="#476581"/></marker>
    <style>
      .title{font:700 30px 'Microsoft YaHei','PingFang SC',sans-serif;fill:#18324b}.label{font:700 25px 'Microsoft YaHei','PingFang SC',sans-serif;fill:#18324b}.text{font:21px 'Microsoft YaHei','PingFang SC',sans-serif;fill:#42576b}.box{stroke:#476581;stroke-width:2}.line{stroke:#476581;stroke-width:3;fill:none;marker-end:url(#arrow)}
    </style>
  </defs>
  <rect width="1200" height="600" rx="24" fill="#F5F8FC"/>
  <text x="600" y="58" text-anchor="middle" class="title">新增入口，不新增第二套业务真相</text>
  <rect x="55" y="130" width="250" height="120" rx="20" fill="#D9ECF7" class="box"/>
  <text x="180" y="180" text-anchor="middle" class="label">水泵房页面</text><text x="180" y="218" text-anchor="middle" class="text">固定业务范围</text>
  <rect x="55" y="330" width="250" height="120" rx="20" fill="#E4F3EA" class="box"/>
  <text x="180" y="380" text-anchor="middle" class="label">机房页面</text><text x="180" y="418" text-anchor="middle" class="text">固定业务范围</text>
  <rect x="425" y="165" width="330" height="250" rx="24" fill="#E8E1F2" class="box"/>
  <text x="590" y="220" text-anchor="middle" class="label">统一告警后端</text>
  <text x="590" y="272" text-anchor="middle" class="text">共享规则 ID</text>
  <text x="590" y="315" text-anchor="middle" class="text">统一记录与数据权限</text>
  <text x="590" y="358" text-anchor="middle" class="text">园区与规则归属校验</text>
  <rect x="880" y="105" width="270" height="145" rx="20" fill="#FCE7DE" class="box"/>
  <text x="1015" y="157" text-anchor="middle" class="label">既有处置链路</text><text x="1015" y="200" text-anchor="middle" class="text">处理 · 忽略 · 工单 · 导出</text>
  <rect x="880" y="340" width="270" height="145" rx="20" fill="#FFF0D9" class="box"/>
  <text x="1015" y="392" text-anchor="middle" class="label">既有关联配置</text><text x="1015" y="435" text-anchor="middle" class="text">通知 · 流程 · 设备 · 预置位</text>
  <path d="M305 190 C360 190 370 225 425 240" class="line"/><path d="M305 390 C360 390 370 355 425 340" class="line"/>
  <path d="M755 235 C810 235 825 185 880 180" class="line"/><path d="M755 345 C810 345 825 405 880 410" class="line"/>
  <text x="600" y="550" text-anchor="middle" class="text">同一规则、同一记录、同一权限边界；旧入口继续保留</text>
</svg>
