<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="640" viewBox="0 0 1200 640" role="img" aria-labelledby="title desc">
  <title id="title">关闭长效登录后的撤销顺序</title>
  <desc id="desc">数据库事务提交后先写禁用标记，再扫描并清理多会话；网关签发前和鉴权前复验禁用状态。</desc>
  <defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0,0 L10,3 L0,6 Z" fill="#476581"/></marker></defs>
  <style>
    .title{font:700 30px 'Microsoft YaHei','PingFang SC',sans-serif;fill:#18324b}.label{font:700 23px 'Microsoft YaHei','PingFang SC',sans-serif;fill:#18324b}.text{font:20px 'Microsoft YaHei','PingFang SC',sans-serif;fill:#42576b}.box{stroke:#476581;stroke-width:2}.line{stroke:#476581;stroke-width:3;fill:none;marker-end:url(#arrow)}
  </style>
  <rect width="1200" height="640" rx="24" fill="#F5F8FC"/>
  <text x="600" y="55" text-anchor="middle" class="title">先阻止新长会话，再清理存量会话</text>
  <rect x="35" y="130" width="245" height="150" rx="20" fill="#E8E1F2" class="box"/><text x="157" y="178" text-anchor="middle" class="label">1. 数据库提交</text><text x="157" y="220" text-anchor="middle" class="text">关闭开关成功后再操作缓存</text>
  <rect x="330" y="130" width="245" height="150" rx="20" fill="#FCE7DE" class="box"/><text x="452" y="178" text-anchor="middle" class="label">2. 写禁用标记</text><text x="452" y="220" text-anchor="middle" class="text">堵住旧快照登录的签发竞态</text>
  <rect x="625" y="130" width="245" height="150" rx="20" fill="#FFF0D9" class="box"/><text x="747" y="178" text-anchor="middle" class="label">3. SCAN 并清理</text><text x="747" y="220" text-anchor="middle" class="text">去重后删除全部目标会话</text>
  <rect x="920" y="130" width="245" height="150" rx="20" fill="#D9ECF7" class="box"/><text x="1042" y="178" text-anchor="middle" class="label">4. 鉴权前复验</text><text x="1042" y="220" text-anchor="middle" class="text">禁用则返回 401，不再续期</text>
  <path d="M280 205 L330 205" class="line"/><path d="M575 205 L625 205" class="line"/><path d="M870 205 L920 205" class="line"/>
  <rect x="100" y="365" width="455" height="150" rx="22" fill="#FFFFFF" class="box"/>
  <text x="327" y="412" text-anchor="middle" class="label">登录签发前检查</text><text x="327" y="453" text-anchor="middle" class="text">已禁用：旧快照登录只能保持普通会话</text><text x="327" y="487" text-anchor="middle" class="text">不会重新补写长效 Token</text>
  <rect x="645" y="365" width="455" height="150" rx="22" fill="#E4F3EA" class="box"/>
  <text x="872" y="412" text-anchor="middle" class="label">重新开启后</text><text x="872" y="453" text-anchor="middle" class="text">事务提交后删除禁用标记</text><text x="872" y="487" text-anchor="middle" class="text">旧 Token 不恢复，必须重新登录</text>
  <text x="600" y="585" text-anchor="middle" class="text">主动退出与强制下线仍通过登录序列失效，不允许长会话继续续期</text>
</svg>
