<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="600" viewBox="0 0 1200 600" role="img" aria-label="收到通知、执行工单、访问数据是不同权限"><rect width="1200" height="600" rx="24" fill="#f5f0e8"/><g font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif"><rect x="46" y="42" width="8" height="42" rx="4" fill="#e8655a"/><text x="76" y="74" font-size="31" fill="#22344a" font-weight="700">收到通知、执行工单、访问数据是不同权限</text><rect x="48" y="130" width="1104" height="117" rx="18" fill="#ffffff"/><rect x="48" y="130" width="210" height="117" rx="18" fill="#a8d8ea"/><text x="72" y="196" font-size="25" fill="#22344a" font-weight="700">通知接收人</text><text x="287" y="175" font-size="25" fill="#22344a" font-weight="700">决定谁收到提醒</text><text x="287" y="214" font-size="22" fill="#52677a" font-weight="400">消息定位参数不授予目标数据访问权</text><rect x="48" y="270" width="1104" height="117" rx="18" fill="#ffffff"/><rect x="48" y="270" width="210" height="117" rx="18" fill="#b5e5cf"/><text x="72" y="336" font-size="25" fill="#22344a" font-weight="700">流程处理人</text><text x="287" y="315" font-size="25" fill="#22344a" font-weight="700">由 BPM 节点定义决定</text><text x="287" y="354" font-size="22" fill="#52677a" font-weight="400">核对本人待办、流程历史与告警回写</text><rect x="48" y="410" width="1104" height="117" rx="18" fill="#ffffff"/><rect x="48" y="410" width="210" height="117" rx="18" fill="#d5c6e0"/><text x="72" y="476" font-size="25" fill="#22344a" font-weight="700">数据与功能权</text><text x="287" y="455" font-size="25" fill="#22344a" font-weight="700">服务端约束查询和写操作</text><text x="287" y="494" font-size="22" fill="#52677a" font-weight="400">列表 / 统计 / 详情 / 导出均需覆盖</text></g></svg>