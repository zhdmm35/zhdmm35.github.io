<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="600" viewBox="0 0 1200 600" role="img" aria-label="故障恢复后，旧记录可能仍然落在窗口之外"><rect width="1200" height="600" rx="24" fill="#f5f0e8"/><g font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif"><rect x="46" y="42" width="8" height="42" rx="4" fill="#e8655a"/><text x="76" y="74" font-size="31" fill="#22344a" font-weight="700">故障恢复后，旧记录可能仍然落在窗口之外</text><rect x="48" y="130" width="1104" height="117" rx="18" fill="#ffffff"/><rect x="48" y="130" width="210" height="117" rx="18" fill="#a8d8ea"/><text x="72" y="196" font-size="25" fill="#22344a" font-weight="700">滚动查询</text><text x="287" y="175" font-size="25" fill="#22344a" font-weight="700">每次只回看 2 小时</text><text x="287" y="214" font-size="22" fill="#52677a" font-weight="400">断链持续过长，窗口会越过旧记录</text><rect x="48" y="270" width="1104" height="117" rx="18" fill="#ffffff"/><rect x="48" y="270" width="210" height="117" rx="18" fill="#b5e5cf"/><text x="72" y="336" font-size="25" fill="#22344a" font-weight="700">宽窗补录</text><text x="287" y="315" font-size="25" fill="#22344a" font-weight="700">明确开始与结束时间</text><text x="287" y="354" font-size="22" fill="#52677a" font-weight="400">先确认源数据仍在，再按记录标识判重</text><rect x="48" y="410" width="1104" height="117" rx="18" fill="#ffffff"/><rect x="48" y="410" width="210" height="117" rx="18" fill="#d5c6e0"/><text x="72" y="476" font-size="25" fill="#22344a" font-weight="700">逐条核对</text><text x="287" y="455" font-size="25" fill="#22344a" font-weight="700">拉取成功仍需业务校验</text><text x="287" y="494" font-size="22" fill="#52677a" font-weight="400">非法字段单独处理，不把传输成功当入库成功</text></g></svg>