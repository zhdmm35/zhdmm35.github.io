<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="600" viewBox="0 0 1200 600" role="img" aria-label="性能等价改写，必须保留历史数据语义"><rect width="1200" height="600" rx="24" fill="#f5f0e8"/><g font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif"><rect x="46" y="42" width="8" height="42" rx="4" fill="#e8655a"/><text x="76" y="74" font-size="31" fill="#22344a" font-weight="700">性能等价改写，必须保留历史数据语义</text><rect x="48" y="130" width="1104" height="117" rx="18" fill="#ffffff"/><rect x="48" y="130" width="210" height="117" rx="18" fill="#a8d8ea"/><text x="72" y="196" font-size="25" fill="#22344a" font-weight="700">并列记录</text><text x="287" y="175" font-size="25" fill="#22344a" font-weight="700">同一时间与 ID 可能重复</text><text x="287" y="214" font-size="22" fill="#52677a" font-weight="400">DENSE_RANK 保留原反关联留下的并列行</text><rect x="48" y="270" width="1104" height="117" rx="18" fill="#ffffff"/><rect x="48" y="270" width="210" height="117" rx="18" fill="#b5e5cf"/><text x="72" y="336" font-size="25" fill="#22344a" font-weight="700">空时间</text><text x="287" y="315" font-size="25" fill="#22344a" font-weight="700">NULL 比较不能按普通时间理解</text><text x="287" y="354" font-size="22" fill="#52677a" font-weight="400">显式保留空时间，计入未知时长分桶</text><rect x="48" y="410" width="1104" height="117" rx="18" fill="#ffffff"/><rect x="48" y="410" width="210" height="117" rx="18" fill="#d5c6e0"/><text x="72" y="476" font-size="25" fill="#22344a" font-weight="700">跨天状态</text><text x="287" y="455" font-size="25" fill="#22344a" font-weight="700">今天无流水，仍可能在场</text><text x="287" y="494" font-size="22" fill="#52677a" font-weight="400">固定统计时刻，用同一快照逐桶比对</text></g></svg>