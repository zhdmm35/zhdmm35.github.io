<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="600" viewBox="0 0 1200 600" role="img" aria-label="文件上传一次，业务提交只携带附件引用"><rect width="1200" height="600" rx="24" fill="#f5f0e8"/><g font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif"><rect x="46" y="42" width="8" height="42" rx="4" fill="#e8655a"/><text x="76" y="74" font-size="31" fill="#22344a" font-weight="700">文件上传一次，业务提交只携带附件引用</text><rect x="48" y="181" width="240" height="211" rx="20" fill="#a8d8ea" stroke="#52677a" stroke-width="2"/><text x="70" y="224" font-size="22" fill="#52677a" font-weight="700">01</text><text x="70" y="281" font-size="27" fill="#22344a" font-weight="700">上传附件</text><text x="70" y="330" font-size="20" fill="#22344a" font-weight="400">浏览器 → 附件服务</text><path d="M298 286 H324 l-8 -7 m8 7 l-8 7" stroke="#52677a" stroke-width="3" fill="none"/><rect x="336" y="181" width="240" height="211" rx="20" fill="#b5e5cf" stroke="#52677a" stroke-width="2"/><text x="358" y="224" font-size="22" fill="#52677a" font-weight="700">02</text><text x="358" y="281" font-size="27" fill="#22344a" font-weight="700">取得 ID</text><text x="358" y="330" font-size="20" fill="#22344a" font-weight="400">确认文件已上传</text><path d="M586 286 H612 l-8 -7 m8 7 l-8 7" stroke="#52677a" stroke-width="3" fill="none"/><rect x="624" y="181" width="240" height="211" rx="20" fill="#d5c6e0" stroke="#52677a" stroke-width="2"/><text x="646" y="224" font-size="22" fill="#52677a" font-weight="700">03</text><text x="646" y="281" font-size="27" fill="#22344a" font-weight="700">提交素材</text><text x="646" y="330" font-size="20" fill="#22344a" font-weight="400">元数据校验 / 入库</text><path d="M874 286 H900 l-8 -7 m8 7 l-8 7" stroke="#52677a" stroke-width="3" fill="none"/><rect x="912" y="181" width="240" height="211" rx="20" fill="#f4c7ab" stroke="#52677a" stroke-width="2"/><text x="934" y="224" font-size="22" fill="#52677a" font-weight="700">04</text><text x="934" y="281" font-size="27" fill="#22344a" font-weight="700">审批同步</text><text x="934" y="330" font-size="20" fill="#22344a" font-weight="400">受控路径 → 集成服务</text><rect x="48" y="460" width="1104" height="84" rx="16" fill="#ffffff"/><text x="75" y="510" font-size="24" fill="#22344a" font-weight="400">文件上传完成 ≠ 素材已入库 ≠ 设备同步完成</text></g></svg>