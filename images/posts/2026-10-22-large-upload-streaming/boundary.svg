<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="600" viewBox="0 0 1200 600" role="img" aria-label="流式传输要检查缓冲，也要计算磁盘与并发"><rect width="1200" height="600" rx="24" fill="#f5f0e8"/><g font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif"><rect x="46" y="42" width="8" height="42" rx="4" fill="#e8655a"/><text x="76" y="74" font-size="31" fill="#22344a" font-weight="700">流式传输要检查缓冲，也要计算磁盘与并发</text><rect x="48" y="130" width="1104" height="117" rx="18" fill="#ffffff"/><rect x="48" y="130" width="210" height="117" rx="18" fill="#a8d8ea"/><text x="72" y="196" font-size="25" fill="#22344a" font-weight="700">Java 堆</text><text x="287" y="175" font-size="25" fill="#22344a" font-weight="700">小缓冲承接传输</text><text x="287" y="214" font-size="22" fill="#52677a" font-weight="400">避免 byte[]、multipart 聚合与 FULL 日志回读</text><rect x="48" y="270" width="1104" height="117" rx="18" fill="#ffffff"/><rect x="48" y="270" width="210" height="117" rx="18" fill="#b5e5cf"/><text x="72" y="336" font-size="25" fill="#22344a" font-weight="700">临时磁盘</text><text x="287" y="315" font-size="25" fill="#22344a" font-weight="700">每个活动任务一份完整文件</text><text x="287" y="354" font-size="22" fill="#52677a" font-weight="400">下载 / 上传失败均尝试清理，保留原始异常</text><rect x="48" y="410" width="1104" height="117" rx="18" fill="#ffffff"/><rect x="48" y="410" width="210" height="117" rx="18" fill="#d5c6e0"/><text x="72" y="476" font-size="25" fill="#22344a" font-weight="700">验证边界</text><text x="287" y="455" font-size="25" fill="#22344a" font-weight="700">128 MB 堆传输 1 GB 生成流</text><text x="287" y="494" font-size="22" fill="#52677a" font-weight="400">本地模拟通过仍需发布后核对真实设备</text></g></svg>