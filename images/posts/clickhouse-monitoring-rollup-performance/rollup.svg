<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="680" viewBox="0 0 1200 680" role="img" aria-labelledby="title desc">
  <title id="title">原始事件经两个物化视图形成两级分钟汇总</title>
  <desc id="desc">原始事件表经用户分钟物化视图写入用户分钟汇总，再经应用分钟物化视图写入应用汇总。历史回填只写用户汇总，应用汇总自动跟随，避免重复累计。</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10z" fill="#287d8e"/></marker>
    <style>
      .bg{fill:#f7f4ee}.title{font:700 30px 'Microsoft YaHei',sans-serif;fill:#183746}.h{font:700 20px 'Microsoft YaHei',sans-serif;fill:#183746}.t{font:17px 'Microsoft YaHei',sans-serif;fill:#284652}.s{font:15px 'Microsoft YaHei',sans-serif;fill:#58707a}.code{font:16px Consolas,monospace;fill:#216f80}.box{fill:#fff;stroke:#9db8c1;stroke-width:2}.view{fill:#e0f1f1;stroke:#41939a;stroke-width:2}.table{fill:#edf7f3;stroke:#58a58b;stroke-width:2}.line{stroke:#287d8e;stroke-width:3;fill:none;marker-end:url(#arrow)}.dash{stroke:#c17b4b;stroke-width:3;fill:none;stroke-dasharray:9 7;marker-end:url(#arrow)}
    </style>
  </defs>
  <rect class="bg" width="1200" height="680" rx="24"/>
  <text class="title" x="55" y="55">一条写入链路，两级分钟汇总</text>
  <rect class="box" x="45" y="150" width="190" height="140" rx="16"/>
  <text class="code" x="140" y="188" text-anchor="middle">ty_trace_raw</text><text class="h" x="140" y="224" text-anchor="middle">原始秒级事件</text><text class="s" x="140" y="256" text-anchor="middle">保留明细用于下钻</text>
  <rect class="view" x="275" y="150" width="190" height="140" rx="16"/>
  <text class="h" x="370" y="190" text-anchor="middle">物化视图</text><text class="code" x="370" y="225" text-anchor="middle">vw_monitoring_</text><text class="code" x="370" y="250" text-anchor="middle">user_minute</text><text class="s" x="370" y="276" text-anchor="middle">处理新插入块</text>
  <rect class="table" x="505" y="150" width="190" height="140" rx="16"/>
  <text class="code" x="600" y="184" text-anchor="middle">agg_monitoring_</text><text class="code" x="600" y="208" text-anchor="middle">user_minute</text><text class="h" x="600" y="241" text-anchor="middle">用户 × 应用 × 分钟</text><text class="s" x="600" y="270" text-anchor="middle">18 项计数与累加量 · 30 天</text>
  <rect class="view" x="735" y="150" width="190" height="140" rx="16"/>
  <text class="h" x="830" y="190" text-anchor="middle">物化视图</text><text class="code" x="830" y="225" text-anchor="middle">vw_monitoring_</text><text class="code" x="830" y="250" text-anchor="middle">minute</text><text class="s" x="830" y="276" text-anchor="middle">跟随用户汇总插入块</text>
  <rect class="table" x="965" y="150" width="190" height="140" rx="16"/>
  <text class="code" x="1060" y="184" text-anchor="middle">agg_monitoring_</text><text class="code" x="1060" y="208" text-anchor="middle">minute</text><text class="h" x="1060" y="241" text-anchor="middle">应用 × 分钟</text><text class="s" x="1060" y="270" text-anchor="middle">3 项计数 · 90 天</text>
  <path class="line" d="M235 220H275"/><path class="line" d="M465 220H505"/><path class="line" d="M695 220H735"/><path class="line" d="M925 220H965"/>
  <rect x="330" y="390" width="540" height="100" rx="16" fill="#fff3e7" stroke="#d88a55" stroke-width="2"/>
  <text class="h" x="600" y="428" text-anchor="middle">历史回填：只写用户分钟汇总</text><text class="t" x="600" y="462" text-anchor="middle">应用分钟汇总由级联视图自动生成，不能再独立回填</text>
  <path class="dash" d="M600 390V325H600V290"/>
  <rect x="70" y="545" width="1060" height="82" rx="16" fill="#e7eef0"/>
  <text class="t" x="600" y="578" text-anchor="middle">查询收益来自少读明细、少做重复 JSON 提取；代价是额外写入、存储与合并开销</text>
  <text class="s" x="600" y="607" text-anchor="middle">物化视图不自动补建创建前的历史，既有数据需要受控回填</text>
</svg>
