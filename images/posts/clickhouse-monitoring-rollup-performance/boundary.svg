<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="600" viewBox="0 0 1200 600" role="img" aria-labelledby="title desc">
  <title id="title">精确滚动窗口的分钟汇总与原始边界补读</title>
  <desc id="desc">过去 N 天及上一周期组成连续窗口，起点、周期分界和结束位置的不完整分钟读取原始秒数据，其余完整分钟读取汇总表。平均值和比率先累加分子分母再计算。</desc>
  <style>
    .bg{fill:#f7f4ee}.title{font:700 30px 'Microsoft YaHei',sans-serif;fill:#183746}.h{font:700 21px 'Microsoft YaHei',sans-serif;fill:#183746}.t{font:18px 'Microsoft YaHei',sans-serif;fill:#284652}.s{font:16px 'Microsoft YaHei',sans-serif;fill:#58707a}.code{font:18px Consolas,monospace;fill:#216f80}.axis{stroke:#66828c;stroke-width:3}.tick{stroke:#66828c;stroke-width:2}.label{font:16px 'Microsoft YaHei',sans-serif;fill:#284652}
  </style>
  <rect class="bg" width="1200" height="600" rx="24"/>
  <text class="title" x="55" y="56">完整分钟读汇总，最多三个边界分钟补原始秒数据</text>
  <text class="s" x="70" y="118">上一周期</text><text class="s" x="1000" y="118">当前周期</text>
  <line class="axis" x1="90" y1="255" x2="1110" y2="255"/>
  <rect x="90" y="205" width="55" height="100" rx="10" fill="#f4c7ab" stroke="#c87d5d" stroke-width="2"/>
  <rect x="145" y="215" width="385" height="80" rx="10" fill="#a8d8ea" stroke="#589aad" stroke-width="2"/>
  <rect x="530" y="205" width="55" height="100" rx="10" fill="#f4c7ab" stroke="#c87d5d" stroke-width="2"/>
  <rect x="585" y="215" width="460" height="80" rx="10" fill="#b5e5cf" stroke="#58a58b" stroke-width="2"/>
  <rect x="1045" y="205" width="55" height="100" rx="10" fill="#f4c7ab" stroke="#c87d5d" stroke-width="2"/>
  <text class="t" x="118" y="252" text-anchor="middle">原始</text><text class="t" x="337" y="260" text-anchor="middle">完整分钟：汇总表</text><text class="t" x="558" y="252" text-anchor="middle">原始</text><text class="t" x="815" y="260" text-anchor="middle">完整分钟：汇总表</text><text class="t" x="1072" y="252" text-anchor="middle">原始</text>
  <line class="tick" x1="118" y1="320" x2="118" y2="338"/><line class="tick" x1="558" y1="320" x2="558" y2="338"/><line class="tick" x1="1072" y1="320" x2="1072" y2="338"/>
  <text class="label" x="118" y="365" text-anchor="middle">起点分钟</text><text class="label" x="558" y="365" text-anchor="middle">当前 / 上一周期分界</text><text class="label" x="1072" y="365" text-anchor="middle">结束分钟</text>
  <text class="s" x="118" y="393" text-anchor="middle">窗口不一定从整分钟开始</text><text class="s" x="558" y="393" text-anchor="middle">两段不能重复或遗漏</text><text class="s" x="1072" y="393" text-anchor="middle">仍可能扫描原始分区</text>
  <rect x="100" y="440" width="1000" height="105" rx="16" fill="#fff" stroke="#cad8dc" stroke-width="2"/>
  <text class="h" x="600" y="478" text-anchor="middle">先累加，再计算</text>
  <text class="code" x="600" y="518" text-anchor="middle">平均值 = Σ耗时总和 ÷ Σ样本数　　比率 = Σ失败数 ÷ Σ总数</text>
</svg>
